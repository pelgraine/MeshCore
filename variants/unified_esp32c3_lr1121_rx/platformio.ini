[unified_esp32c3_lr1121_base]
extends = esp32_base
board = esp32-c3-devkitm-1
board_build.partitions = variants/unified_esp32c3_lr1121_rx/partitions.csv
extra_scripts =
  ${esp32_base.extra_scripts}
  post:variants/unified_esp32c3_lr1121_rx/check-image-size.py
build_flags =
  ${esp32_base.build_flags}
  -I variants/unified_esp32c3_lr1121_rx
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D ESP32_CPU_FREQ=80
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D WRAPPER_CLASS=UnifiedLR1121Wrapper
  -D UNIFIED_RGB_PACKET_LED=1
  -D UNIFIED_RGB_LED_BRIGHTNESS=16
  -D LR11X0_DIO3_TCXO_VOLTAGE=1.8
  -D RX_BOOSTED_GAIN=1
  -D MIN_NOISE_FLOOR_DBM=-127
  -D P_LORA_DIO_1=1
  -D P_LORA_BUSY=3
  -D P_LORA_NSS=7
  -D P_LORA_RESET=2
  -D P_LORA_SCLK=6
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=4
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/unified_esp32c3_lr1121_rx/UnifiedOTA.cpp>
  +<helpers/sensors>
lib_deps = ${esp32_base.lib_deps}

[unified_esp32c3_lr1121_subghz]
extends = unified_esp32c3_lr1121_base
extra_scripts =
  pre:variants/unified_esp32c3_lr1121_rx/patch-radiolib.py
  ${unified_esp32c3_lr1121_base.extra_scripts}
build_flags = ${unified_esp32c3_lr1121_base.build_flags}
  -D RADIO_CLASS=UnifiedLR1121Radio
  ; LR1121 HP PA drive dBm, not measured antenna output.
  -D LORA_TX_POWER=12
  -D MIN_LORA_TX_POWER=12
  -D MAX_LORA_TX_POWER=22
  -D LR1121_FORCE_HP_PA=1
build_src_filter = ${unified_esp32c3_lr1121_base.build_src_filter}
  +<../variants/unified_esp32c3_lr1121_rx/target.cpp>

[env:unified_esp32c3_lr1121_rx_companion_radio_ble]
extends = unified_esp32c3_lr1121_subghz
build_flags = ${unified_esp32c3_lr1121_subghz.build_flags}
  -D MAX_CONTACTS=120
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D ENABLE_COMPANION_OTA=1
  -D UNIFIED_OTA_STOP_BLE=1
  -D OFFLINE_QUEUE_SIZE=32
  -D CORE_DEBUG_LEVEL=1
  -D RADIOLIB_DEBUG_BASIC=1
  -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
build_src_filter = ${unified_esp32c3_lr1121_subghz.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/*.cpp>
lib_deps =
  ${unified_esp32c3_lr1121_subghz.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:unified_esp32c3_lr1121_rx_repeater]
extends = env:unified_esp32c3_lr1121_rx_companion_radio_ble
build_unflags =
  ${env:unified_esp32c3_lr1121_rx_companion_radio_ble.build_unflags}
  -D BLE_PIN_CODE=123456
  -D ENABLE_COMPANION_OTA=1
  -D UNIFIED_OTA_STOP_BLE=1
  -D MAX_CONTACTS=120
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=32
build_flags =
  ${env:unified_esp32c3_lr1121_rx_companion_radio_ble.build_flags}
  -D ADVERT_NAME='"ELRS LR1121 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=75
build_src_filter = ${unified_esp32c3_lr1121_subghz.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:unified_esp32c3_lr1121_rx_companion_radio_wifi]
extends = env:unified_esp32c3_lr1121_rx_companion_radio_ble
build_unflags = ${env:unified_esp32c3_lr1121_rx_companion_radio_ble.build_unflags}
  -D BLE_PIN_CODE=123456
  -D UNIFIED_OTA_STOP_BLE=1
build_flags = ${env:unified_esp32c3_lr1121_rx_companion_radio_ble.build_flags}
  -D ENABLE_WIFI_INTERFACE
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
build_src_filter = ${env:unified_esp32c3_lr1121_rx_companion_radio_ble.build_src_filter}
  +<helpers/wifi/*.cpp>

[env:unified_esp32c3_lr1121_rx_i2c_repeater]
extends = env:unified_esp32c3_lr1121_rx_repeater
build_unflags = ${env:unified_esp32c3_lr1121_rx_repeater.build_unflags}
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
build_flags = ${env:unified_esp32c3_lr1121_rx_repeater.build_flags}
  -D UNIFIED_I2C=1
  -D ENV_INCLUDE_INA219=1
  -D PIN_BOARD_SDA=20
  -D PIN_BOARD_SCL=21
lib_deps = ${env:unified_esp32c3_lr1121_rx_repeater.lib_deps}
  adafruit/Adafruit INA219 @ ^1.2.3

[env:unified_esp32c3_lr1121_rx_i2c_companion_radio_ble]
extends = env:unified_esp32c3_lr1121_rx_companion_radio_ble
build_unflags = ${env:unified_esp32c3_lr1121_rx_companion_radio_ble.build_unflags}
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
build_flags = ${env:unified_esp32c3_lr1121_rx_companion_radio_ble.build_flags}
  -D UNIFIED_I2C=1
  -D ENV_INCLUDE_INA219=1
  -D PIN_BOARD_SDA=20
  -D PIN_BOARD_SCL=21
lib_deps = ${env:unified_esp32c3_lr1121_rx_companion_radio_ble.lib_deps}
  adafruit/Adafruit INA219 @ ^1.2.3

[env:unified_esp32c3_lr1121_rx_i2c_companion_radio_wifi]
extends = env:unified_esp32c3_lr1121_rx_companion_radio_wifi
build_unflags = ${env:unified_esp32c3_lr1121_rx_companion_radio_wifi.build_unflags}
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
build_flags = ${env:unified_esp32c3_lr1121_rx_companion_radio_wifi.build_flags}
  -D UNIFIED_I2C=1
  -D ENV_INCLUDE_INA219=1
  -D PIN_BOARD_SDA=20
  -D PIN_BOARD_SCL=21
lib_deps = ${env:unified_esp32c3_lr1121_rx_companion_radio_wifi.lib_deps}
  adafruit/Adafruit INA219 @ ^1.2.3

[env:unified_esp32c3_lr1121_rx_companion_radio_usb]
extends = env:unified_esp32c3_lr1121_rx_companion_radio_ble
build_unflags = ${env:unified_esp32c3_lr1121_rx_companion_radio_ble.build_unflags}
  -D BLE_PIN_CODE=123456
  -D UNIFIED_OTA_STOP_BLE=1
build_flags = ${env:unified_esp32c3_lr1121_rx_companion_radio_ble.build_flags}
  -D ENABLE_USB_INTERFACE

[env:unified_esp32c3_lr1121_rx_repeater_bridge_rs232]
extends = env:unified_esp32c3_lr1121_rx_repeater
build_flags = ${env:unified_esp32c3_lr1121_rx_repeater.build_flags}
  -D UNIFIED_SERIAL_BRIDGE=1
  -D WITH_RS232_BRIDGE=Serial1
  -D WITH_RS232_BRIDGE_RX=20
  -D WITH_RS232_BRIDGE_TX=21
build_src_filter = ${env:unified_esp32c3_lr1121_rx_repeater.build_src_filter}
  +<helpers/bridges/RS232Bridge.cpp>

[env:unified_esp32c3_lr1121_rx_repeater_bridge_espnow]
extends = env:unified_esp32c3_lr1121_rx_repeater
build_flags = ${env:unified_esp32c3_lr1121_rx_repeater.build_flags}
  -D WITH_ESPNOW_BRIDGE=1
build_src_filter = ${env:unified_esp32c3_lr1121_rx_repeater.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>

[env:unified_esp32c3_lr1121_rx_i2c_repeater_bridge_espnow]
extends = env:unified_esp32c3_lr1121_rx_repeater_bridge_espnow
build_unflags = ${env:unified_esp32c3_lr1121_rx_repeater.build_unflags}
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
build_flags = ${env:unified_esp32c3_lr1121_rx_repeater_bridge_espnow.build_flags}
  -D UNIFIED_I2C=1
  -D ENV_INCLUDE_INA219=1
  -D PIN_BOARD_SDA=20
  -D PIN_BOARD_SCL=21
lib_deps = ${env:unified_esp32c3_lr1121_rx_repeater.lib_deps}
  adafruit/Adafruit INA219 @ ^1.2.3

[env:unified_esp32c3_lr1121_rx_kiss_modem]
extends = unified_esp32c3_lr1121_subghz
build_flags = ${unified_esp32c3_lr1121_subghz.build_flags}
  -D ENABLE_COMPANION_OTA=1
  -D UNIFIED_KISS_OTA=1
build_src_filter = ${unified_esp32c3_lr1121_subghz.build_src_filter}
  +<../examples/kiss_modem/>
lib_deps = ${unified_esp32c3_lr1121_subghz.lib_deps}
  ${esp32_ota.lib_deps}
