[LilyGo_TBeam_1W2]
extends = esp32_base
board = t_beam_1w
build_flags =
  ${esp32_base.build_flags}
  -I variants/lilygo_tbeam_1w2

  ; Radio - LR2021 with external PAs (LilyGo order code H768-B)
  -D RADIO_CLASS=TBeam1W2Radio
  -D WRAPPER_CLASS=CustomLR2021Wrapper
  -D USE_LR2021
  -D P_LORA_DIO_1=1
  -D LR2021_IRQ_DIO=10        ; GPIO1 is connected to LR2021 DIO10
  -D P_LORA_NSS=15
  -D P_LORA_RESET=3
  -D P_LORA_BUSY=38
  -D P_LORA_SCLK=13
  -D P_LORA_MISO=12
  -D P_LORA_MOSI=11
  -D LR2021_TCXO_VOLTAGE=3.0f ; LilyGo: TCXO voltage 2.85~3.15V

  ; TX power (see TBeam1W2Radio.h)
  ;   Sub-GHz: default 20, max 22 (LilyGo's maximum setting)
  ;   2.4 GHz: LORA_TX_POWER_2G4 / MAX_LORA_TX_POWER_2G4 in variant.h
  -D LORA_TX_POWER=20
  -D MAX_LORA_TX_POWER=22

  ; Battery - 2S 7.4V LiPo (6.0V min, 8.4V max)
  -D BATT_MIN_MILLIVOLTS=6000
  -D BATT_MAX_MILLIVOLTS=8400

  ; Display - SH1106 OLED at 0x3C
  -D DISPLAY_CLASS=SH1106Display

  ; I2C pins
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=9

  ; GPS - L76K module
  ; GNSS_TXD (IO5) = GPS transmits -> MCU RX
  ; GNSS_RXD (IO6) = GPS receives -> MCU TX
  -D PIN_GPS_TX=5
  -D PIN_GPS_RX=6
  -D PIN_GPS_EN=16
  -D ENV_INCLUDE_GPS=1

  ; User interface
  -D PIN_USER_BTN=17

build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_tbeam_1w2>
  +<helpers/ui/SH1106Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/sensors>

lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SH110X @ ~2.1.13
  stevemarple/MicroNMEA @ ~2.0.6

; === LILYGO T-Beam 1W2 Repeater ===
[env:LilyGo_TBeam_1W2_repeater]
extends = LilyGo_TBeam_1W2
build_flags =
  ${LilyGo_TBeam_1W2.build_flags}
  -D ADVERT_NAME='"T-Beam 1W2 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D PERSISTANT_GPS=1
  -D ENV_SKIP_GPS_DETECT=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_TBeam_1W2.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${LilyGo_TBeam_1W2.lib_deps}
  ${esp32_ota.lib_deps}

; === LILYGO T-Beam 1W2 Room Server ===
[env:LilyGo_TBeam_1W2_room_server]
extends = LilyGo_TBeam_1W2
build_flags =
  ${LilyGo_TBeam_1W2.build_flags}
  -D ADVERT_NAME='"T-Beam 1W2 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  -D PERSISTANT_GPS=1
  -D ENV_SKIP_GPS_DETECT=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_TBeam_1W2.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${LilyGo_TBeam_1W2.lib_deps}
  ${esp32_ota.lib_deps}

; === LILYGO T-Beam 1W2 Companion Radio (USB) ===
[env:LilyGo_TBeam_1W2_companion_radio_usb]
extends = LilyGo_TBeam_1W2
build_flags =
  ${LilyGo_TBeam_1W2.build_flags}
  -I examples/companion_radio/ui-new
  -D SD_SETTINGS_BACKUP=1   ; SD card: back up prefs, channels, contacts and identity at boot; restore any missing from flash
  -D SD_BACKUP_DIR='"/meshcore/tbeam1w2"'
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D PERSISTANT_GPS=1
  -D ENV_SKIP_GPS_DETECT=1
  -D ENABLE_USB_INTERFACE
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_TBeam_1W2.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TBeam_1W2.lib_deps}
  densaugeo/base64 @ ~1.4.0

; === LILYGO T-Beam 1W2 Companion Radio (BLE) ===
[env:LilyGo_TBeam_1W2_companion_radio_ble]
extends = LilyGo_TBeam_1W2
build_flags =
  ${LilyGo_TBeam_1W2.build_flags}
  -I examples/companion_radio/ui-new
  -D SD_SETTINGS_BACKUP=1   ; SD card: back up prefs, channels, contacts and identity at boot; restore any missing from flash
  -D SD_BACKUP_DIR='"/meshcore/tbeam1w2"'
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D PERSISTANT_GPS=1
  -D ENV_SKIP_GPS_DETECT=1
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_TBeam_1W2.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TBeam_1W2.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Garmin watch build: as LilyGo_TBeam_1W2_companion_radio_ble plus BLE_GARMIN, with
; 2000 contacts and the BLE settings of Station_G2_companion_radio_ble_garmin. Pair
; the watch through its Sensors & Accessories menu (the node appears as a heart-rate
; sensor), switch that sensor entry off, then open the Meck watch app. Phones pair
; without a PIN on this build.
[env:LilyGo_TBeam_1W2_companion_radio_ble_garmin]
extends = LilyGo_TBeam_1W2
build_flags =
  ${LilyGo_TBeam_1W2.build_flags}
  -I examples/companion_radio/ui-new
  -D SD_SETTINGS_BACKUP=1   ; SD card: back up prefs, channels, contacts and identity at boot; restore any missing from flash
  -D SD_BACKUP_DIR='"/meshcore/tbeam1w2"'
  -D MAX_CONTACTS=2000
  -D MAX_GROUP_CHANNELS=100
  -D BLE_PIN_CODE=123456
  -D BLE_GARMIN=1   ; Garmin watch: just-works pairing, 20-byte slicing, heart-rate sensor advert (see SerialBLEInterface.h)
  -D ESP32_BLE_TX_POWER=ESP_PWR_LVL_P21
  -D UI_NO_WAKE_ON_MSG
  -D UI_NO_MSG_PREVIEW
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=1024
  -D PERSISTANT_GPS=1
  -D ENV_SKIP_GPS_DETECT=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_TBeam_1W2.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TBeam_1W2.lib_deps}
  densaugeo/base64 @ ~1.4.0

; === LILYGO T-Beam 1W2 Companion Radio (WiFi) ===
[env:LilyGo_TBeam_1W2_companion_radio_wifi]
extends = LilyGo_TBeam_1W2
build_flags =
  ${LilyGo_TBeam_1W2.build_flags}
  -I examples/companion_radio/ui-new
  -D SD_SETTINGS_BACKUP=1   ; SD card: back up prefs, channels, contacts and identity at boot; restore any missing from flash
  -D SD_BACKUP_DIR='"/meshcore/tbeam1w2"'
  -D ENABLE_WIFI_INTERFACE
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
  -D PERSISTANT_GPS=1
  -D ENV_SKIP_GPS_DETECT=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${LilyGo_TBeam_1W2.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TBeam_1W2.lib_deps}
  densaugeo/base64 @ ~1.4.0
