; =====================================================================================
;  LilyGo T3-S3 with SX1280 PA (2.4 GHz LoRa + external FEM)
;
;  Same board (t3_s3_v1_x) and 0.96" SSD1306 OLED as the T3-S3 LR1121 variant. The radio
;  is an SX1280 behind an external FEM (PA on transmit, LNA on receive) controlled by
;  two GPIOs: TXEN=GPIO10, RXEN=GPIO21 (LilyGo truth table: TXEN=1 -> PA active;
;  TXEN=0, RXEN=1 -> LNA active). RadioLib drives them via setRfSwitchPins().
;
;  POWER: LilyGo's doc for this board says the SX1280 must drive the FEM at only
;  2-5 dBm (3 dBm already gives the full +20 dBm module output) and that 5 dBm at the
;  FEM input can damage it. LORA_TX_POWER and MAX_LORA_TX_POWER are therefore 3, and
;  CustomSX1280 clamps every power request to that ceiling in code, so neither the app
;  nor 'set tx' on a repeater can push more into the FEM. Do not raise the cap.
;
;  GPIO21 is the FEM RXEN on this board, so the OLED runs with PIN_OLED_RESET=-1 (it
;  initialises over I2C without a reset toggle). Do NOT set the OLED reset to 21 here.
;  Pin map and FEM notes: LilyGo-LoRa-Series/docs/en/t3_s3_sx1280pa/t3_s3_sx1280pa.md
;  LilyGo also notes this version has no BMS: use cells with their own protection, and
;  always have the antenna connected before the radio transmits.
;
;  Environments (6), all on the Sydney 2.4 GHz plan (2400.5 / 406.25 / SF11 / CR8):
;    LilyGo_T3S3_sx1280pa_companion_radio_ble
;    LilyGo_T3S3_sx1280pa_companion_radio_usb
;    LilyGo_T3S3_sx1280pa_repeater
;    LilyGo_T3S3_sx1280pa_repeater_bridge_espnow
;    LilyGo_T3S3_sx1280pa_repeater_debug
;    LilyGo_T3S3_sx1280pa_room_server
; =====================================================================================

; ---- shared hardware (pins / radio class / FEM control) ----
[sx1280pa_t3s3_hw]
build_flags =
  -I variants/lilygo_t3s3_sx1280pa
  -D LILYGO_T3S3_SX1280PA
  -D PIN_VBAT_READ=1
  -D PIN_USER_BTN=0
  -D PIN_BOARD_SDA=18
  -D PIN_BOARD_SCL=17
  ; --- SX1280 pin wiring (T3-S3 SX1280PA, per LilyGo doc) ---
  -D P_LORA_NSS=7
  -D P_LORA_SCLK=5
  -D P_LORA_MISO=3
  -D P_LORA_MOSI=6
  -D P_LORA_RESET=8
  -D P_LORA_BUSY=36
  -D P_LORA_DIO_1=9            ; radio IRQ
  -D SX128X_RXEN=21            ; FEM LNA enable (RX)
  -D SX128X_TXEN=10            ; FEM PA enable (TX)
  -D USE_SX1280
  -D RADIO_CLASS=CustomSX1280
  -D WRAPPER_CLASS=CustomSX1280Wrapper

; ---- 2.4 GHz plan (Sydney) ----
[LilyGo_T3S3_sx1280pa]
extends = esp32_base
board = t3_s3_v1_x
; esp32_base excludes the SX128x driver; un-exclude it for this radio.
build_unflags = -D RADIOLIB_EXCLUDE_SX128X=1
build_flags =
  ${esp32_base.build_flags}
  ${sx1280pa_t3s3_hw.build_flags}
  ; --- FEM-safe chip output: 3 dBm into the FEM = +20 dBm out of the module ---
  -D LORA_TX_POWER=3
  -D MAX_LORA_TX_POWER=3
  ; --- default 2.4 GHz frequency plan ---
  -D LORA_FREQ=2400.5
  -D LORA_BW=406.25
  -D LORA_SF=11
  -D LORA_CR=8
  -D LORA_MAX_BW=1625.0        ; SX1280 maximum LoRa bandwidth
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_t3s3_sx1280pa>
lib_deps =
  ${esp32_base.lib_deps}

; =====================================================================================
;  Environments
; =====================================================================================

[env:LilyGo_T3S3_sx1280pa_companion_radio_ble]
extends = LilyGo_T3S3_sx1280pa
build_flags =
  ${LilyGo_T3S3_sx1280pa.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
  ; --- on-board 0.96" SSD1306 OLED (RST=-1: GPIO21 is the FEM RXEN on this board) ---
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=-1
build_src_filter = ${LilyGo_T3S3_sx1280pa.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/esp32/SerialBLEInterface.cpp>
lib_deps =
  ${LilyGo_T3S3_sx1280pa.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:LilyGo_T3S3_sx1280pa_companion_radio_usb]
extends = LilyGo_T3S3_sx1280pa
build_flags =
  ${LilyGo_T3S3_sx1280pa.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  ; --- on-board 0.96" SSD1306 OLED (RST=-1: GPIO21 is the FEM RXEN on this board) ---
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=-1
build_src_filter = ${LilyGo_T3S3_sx1280pa.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/SSD1306Display.cpp>
lib_deps =
  ${LilyGo_T3S3_sx1280pa.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:LilyGo_T3S3_sx1280pa_repeater]
extends = LilyGo_T3S3_sx1280pa
build_flags =
  ${LilyGo_T3S3_sx1280pa.build_flags}
  -D ADVERT_NAME='"T3S3 SX1280PA Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ; --- on-board 0.96" SSD1306 OLED (RST=-1: GPIO21 is the FEM RXEN on this board) ---
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=-1
build_src_filter = ${LilyGo_T3S3_sx1280pa.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/SSD1306Display.cpp>
lib_deps =
  ${LilyGo_T3S3_sx1280pa.lib_deps}
  ${esp32_ota.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

; ---- ESP-NOW bridge repeater ----
; Normal repeater plus the ESP-NOW bridge: two bridge repeaters with matching channel
; and secret carry mesh packets between each other over the ESP32's own WiFi radio
; (onboard ceramic antenna). Runtime config over serial: set bridge.enabled /
; bridge.channel (1-13) / bridge.secret / bridge.delay. Defaults: enabled, channel 1,
; secret "LVSITANOS", 500 ms delay. BridgeBase.cpp is already in the base source
; filter; only the ESP-NOW implementation needs adding here.
[env:LilyGo_T3S3_sx1280pa_repeater_bridge_espnow]
extends = LilyGo_T3S3_sx1280pa
build_flags =
  ${LilyGo_T3S3_sx1280pa.build_flags}
  -D ADVERT_NAME='"T3S3 SX1280PA ESPNow"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_ESPNOW_BRIDGE=1
;  -D BRIDGE_DEBUG=1
  ; --- on-board 0.96" SSD1306 OLED (RST=-1: GPIO21 is the FEM RXEN on this board) ---
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=-1
build_src_filter = ${LilyGo_T3S3_sx1280pa.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/bridges/ESPNowBridge.cpp>
  +<helpers/ui/SSD1306Display.cpp>
lib_deps =
  ${LilyGo_T3S3_sx1280pa.lib_deps}
  ${esp32_ota.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

; ---- debug repeater (verbose dispatcher/radio logging on USB serial) ----
; MESH_DEBUG prints radio/driver activity (including any clamped power request or
; refused retune), MESH_PACKET_LOGGING prints every packet the dispatcher sends and
; receives, and the green board LED lights for the duration of every transmit.
[env:LilyGo_T3S3_sx1280pa_repeater_debug]
extends = env:LilyGo_T3S3_sx1280pa_repeater
build_flags =
  ${env:LilyGo_T3S3_sx1280pa_repeater.build_flags}
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1
  -D P_LORA_TX_LED=37

[env:LilyGo_T3S3_sx1280pa_room_server]
extends = LilyGo_T3S3_sx1280pa
build_flags =
  ${LilyGo_T3S3_sx1280pa.build_flags}
  -D ADVERT_NAME='"T3S3 SX1280PA Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
  ; --- on-board 0.96" SSD1306 OLED (RST=-1: GPIO21 is the FEM RXEN on this board) ---
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=-1
build_src_filter = ${LilyGo_T3S3_sx1280pa.build_src_filter}
  +<../examples/simple_room_server>
  +<helpers/ui/SSD1306Display.cpp>
lib_deps =
  ${LilyGo_T3S3_sx1280pa.lib_deps}
  ${esp32_ota.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
