; =====================================================================================
;  RadioMaster Ranger Nano 2.4GHz (ExpressLRS TX module) running MeshCore
;
;  ESP32 (classic) + SX1281 behind an external PA/LNA, with an ESP8285 "backpack" that
;  this firmware leaves alone. No display, no buttons, no battery sense.
;
;  Pin map: ExpressLRS targets repo, layout "Radiomaster Ranger Micro.json" (the
;  ranger-nano target in targets.json uses that layout with its own power overlay).
;    radio: NSS=4 SCK=18 MISO=19 MOSI=23 RST=5 BUSY=22 DIO1=21
;    PA/LNA switch: RXEN=32 TXEN=33
;    fan enable: 27 (driven on at radio init, always on)
;
;  POWER: these numbers are the SX1281 chip drive level going INTO the external PA,
;  not the module output. ExpressLRS's ranger-nano power table is
;  [-18,-15,-12,-8,-5,0] for 25/50/100/250/500/1000 mW, so chip 0 dBm = 1 W out.
;  LORA_TX_POWER and MAX_LORA_TX_POWER are 0, and CustomSX1280 clamps every power
;  request to that ceiling, so nothing can drive the PA harder than ExpressLRS does.
;
;  I2C: GPIO 21/22 are the classic ESP32 default I2C pins but are DIO1/BUSY here, so
;  PIN_BOARD_SDA/SCL are -1 to stop ESP32Board::begin() starting Wire on them.
;
;  Board/partitions follow ExpressLRS's own ESP32 TX build (esp32dev, min_spiffs.csv).
;
;  Environments, on the Sydney 2.4 GHz plan (2400.5 / 406.25 / SF11 / CR8):
;    Radiomaster_Ranger_Nano_companion_radio_ble
;    Radiomaster_Ranger_Nano_repeater
; =====================================================================================

[Radiomaster_Ranger_Nano]
extends = esp32_base
board = esp32dev
board_build.partitions = min_spiffs.csv
; esp32_base excludes the SX128x driver; un-exclude it for this radio.
build_unflags = -D RADIOLIB_EXCLUDE_SX128X=1
build_flags =
  ${esp32_base.build_flags}
  -I variants/radiomaster_ranger_nano
  -D RADIOMASTER_RANGER_NANO
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  ; --- SX1281 wiring ---
  -D P_LORA_NSS=4
  -D P_LORA_SCLK=18
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=23
  -D P_LORA_RESET=5
  -D P_LORA_BUSY=22
  -D P_LORA_DIO_1=21
  -D SX128X_RXEN=32            ; PA/LNA: LNA enable (RX)
  -D SX128X_TXEN=33            ; PA/LNA: PA enable (TX)
  -D PIN_FAN_EN=27
  -D USE_SX1280
  -D RADIO_CLASS=CustomSX1280
  -D WRAPPER_CLASS=CustomSX1280Wrapper
  ; --- chip drive into the PA: 0 dBm = 1 W module output (ExpressLRS table) ---
  -D LORA_TX_POWER=0
  -D MAX_LORA_TX_POWER=0
  ; --- default 2.4 GHz frequency plan ---
  -D LORA_FREQ=2400.5
  -D LORA_BW=406.25
  -D LORA_SF=11
  -D LORA_CR=8
  -D LORA_MAX_BW=1625.0        ; SX1280 maximum LoRa bandwidth
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/radiomaster_ranger_nano>
lib_deps =
  ${esp32_base.lib_deps}

[env:Radiomaster_Ranger_Nano_companion_radio_ble]
extends = Radiomaster_Ranger_Nano
build_flags =
  ${Radiomaster_Ranger_Nano.build_flags}
  -D MAX_CONTACTS=160          ; classic ESP32 DRAM limit (same as other classic-ESP32 companion builds)
  -D MAX_GROUP_CHANNELS=20
  -D RANGER_NANO_DIAG          ; 30 s heap + chip temperature report on USB serial (see target.cpp)
  -D OFFLINE_QUEUE_SIZE=128
  -D BLE_PIN_CODE=123456
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Radiomaster_Ranger_Nano.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/SerialBLEInterface.cpp>
lib_deps =
  ${Radiomaster_Ranger_Nano.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Radiomaster_Ranger_Nano_repeater]
extends = Radiomaster_Ranger_Nano
build_flags =
  ${Radiomaster_Ranger_Nano.build_flags}
  -D ADVERT_NAME='"Ranger Nano Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D RANGER_NANO_DIAG          ; 30 s heap + chip temperature report on USB serial (see target.cpp)
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Radiomaster_Ranger_Nano.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${Radiomaster_Ranger_Nano.lib_deps}
  ${esp32_ota.lib_deps}
