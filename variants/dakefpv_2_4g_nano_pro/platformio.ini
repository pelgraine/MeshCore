[DakeFPV_2_4G_Nano_Pro]
extends = unified_esp32c3_lr1121_base
build_unflags =
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
build_flags =
  -I variants/dakefpv_2_4g_nano_pro
  ${unified_esp32c3_lr1121_base.build_flags}
  ; Serial uses UART0 on the ELRS RX/TX pads (GPIO20/GPIO21).
  -D RADIO_CLASS=DakeLR1121
  ; Comment out the next two lines to disable the GPIO8 GRB packet LED for all firmware roles.
  ; Settings and preferences represent nominal board output in dBm.
  -D LORA_TX_POWER_PROFILE=1
  -D LORA_TX_POWER=20
  -D MIN_LORA_TX_POWER=14
  -D MAX_LORA_TX_POWER=30
  -D LORA_FREQ=2483.0
  -D LORA_BW=406.25
  -D LORA_SF=11
  ; Raw LR1121 RSSI reaches -127.5 dBm
build_src_filter = ${unified_esp32c3_lr1121_base.build_src_filter}
  +<../variants/dakefpv_2_4g_nano_pro>
  +<helpers/sensors>
lib_deps =
  ${unified_esp32c3_lr1121_base.lib_deps}

[env:DakeFPV_2_4G_Nano_Pro_repeater]
extends = DakeFPV_2_4G_Nano_Pro
build_src_filter = ${DakeFPV_2_4G_Nano_Pro.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${DakeFPV_2_4G_Nano_Pro.build_flags}
  -D ADVERT_NAME='"DakeFPV 2.4G Nano Pro Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=75
 ; -D MESH_PACKET_LOGGING=1
 ; -D MESH_DEBUG=1
lib_deps =
  ${DakeFPV_2_4G_Nano_Pro.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:DakeFPV_2_4G_Nano_Pro_room_server]
extends = DakeFPV_2_4G_Nano_Pro
build_src_filter = ${DakeFPV_2_4G_Nano_Pro.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
build_flags =
  ${DakeFPV_2_4G_Nano_Pro.build_flags}
  -D ADVERT_NAME='"DakeFPV 2.4G Nano Pro Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${DakeFPV_2_4G_Nano_Pro.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:DakeFPV_2_4G_Nano_Pro_i2c_repeater]
extends = env:DakeFPV_2_4G_Nano_Pro_repeater
build_unflags =
  ${DakeFPV_2_4G_Nano_Pro.build_unflags}
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
build_flags =
  ${env:DakeFPV_2_4G_Nano_Pro_repeater.build_flags}
  -D UNIFIED_I2C=1
  -D ENV_INCLUDE_INA219=1
  -D PIN_BOARD_SDA=20
  -D PIN_BOARD_SCL=21
lib_deps =
  ${env:DakeFPV_2_4G_Nano_Pro_repeater.lib_deps}
  adafruit/Adafruit INA219 @ ^1.2.3

[env:DakeFPV_2_4G_Nano_Pro_companion_radio_ble]
extends = DakeFPV_2_4G_Nano_Pro
build_src_filter = ${DakeFPV_2_4G_Nano_Pro.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/*.cpp>
build_flags =
  ${DakeFPV_2_4G_Nano_Pro.build_flags}
  -D MAX_CONTACTS=120
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D ENABLE_COMPANION_OTA=1
  -D UNIFIED_OTA_STOP_BLE=1
  ; Leave heap for BLE and on-demand Wi-Fi OTA on the C3 (no PSRAM).
  -D OFFLINE_QUEUE_SIZE=32
  ; -D BLE_DEBUG_LOGGING=1
  -D CORE_DEBUG_LEVEL=1
  ; The default 16 KiB TCP task stack does not fit alongside BLE and Wi-Fi.
  -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
  ; -D MESH_PACKET_LOGGING=1
  ; -D MESH_DEBUG=1
lib_deps =
  ${DakeFPV_2_4G_Nano_Pro.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0

